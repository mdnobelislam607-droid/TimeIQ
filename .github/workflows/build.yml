name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'TimeIQ.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Save APK into the repository
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TimeIQ.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add TimeIQ.apk
          git commit -m "Add built APK"
          git push
