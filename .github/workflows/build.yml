name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'TimeIQ.apk'
      - 'timeiq-test.jks'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create test signing key if missing
        run: |
          if [ ! -f timeiq-test.jks ]; then
            keytool -genkeypair -keystore timeiq-test.jks \
              -storepass timeiq123 -keypass timeiq123 \
              -alias timeiq -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=TimeIQ Test"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Save APK into the repository
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TimeIQ.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add TimeIQ.apk timeiq-test.jks
          git diff --cached --quiet || git commit -m "Add built APK"
          git pull --rebase
          git push
